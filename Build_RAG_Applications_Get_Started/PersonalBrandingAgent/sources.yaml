# Personal Knowledge Source Registry
# =============================================================================
# Which directories are evidence about the user, and which are not.
#
# This file replaces "the workspace roots" as the input to synchronization.
# The roots recorded in PLAN.md §5.3 are ~8 directories holding ~28 git
# repositories, 17 Python virtual environments (~17 GB), coursework,
# unrelated third-party templates, and this application itself. Ingesting a
# root wholesale would put all of that into the knowledge base as professional
# evidence, so every source below is named exactly and no code anywhere
# recursively scans a root.
#
# Grounded in the workspace inspection recorded in
# docs/architecture/source-registry.md. Every path here was verified to exist,
# and every lifecycle value was assigned from that inspection — never inferred
# from a Markdown heading, and never from inactivity (PLAN.md §5.5).
#
# Definition vs. state: THIS FILE IS DEFINITION ONLY. The last processed
# revision for each source, and every lifecycle transition, live in the
# operational store (state_db/) — sync_checkpoints and source_lifecycle.
# Writing a revision into this file would make configuration that must be
# reviewable churn on every run.
#
# Reading it: `defaults.exclude` applies to every source; a source's own
# `exclude` is appended to it. A path is admitted only if it matches at least
# one include pattern AND no exclude pattern. Exclusions always carry a
# reason, because an unexplained exclusion cannot be reviewed and therefore
# never gets removed.
# =============================================================================

version: 1


# --- Include profiles ---------------------------------------------------------
#
# Named pattern sets, referenced by YAML alias (`include: *source_code`). They
# live here so the same list is not written out thirty times, and they are
# intentionally few: tailoring a profile per language would add ceremony
# without changing what is admitted, because a stray .js in a Python
# repository is still the user's work. What must *not* be admitted —
# virtualenvs, generated vector stores, another cohort's code — is the job of
# the exclusions below, not of the include lists.
#
# This section is read by YAML, not by the loader.
include_profiles:

  # Authored text: source code, prose, and configuration.
  source_code: &source_code
    - "**/*.md"
    - "**/*.py"
    - "**/*.c"
    - "**/*.h"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.ts"
    - "**/*.ipynb"
    - "**/*.html"
    - "**/*.css"
    - "**/*.sql"
    - "**/*.txt"
    - "**/*.json"
    - "**/*.csv"
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.sh"
    - "**/*.rb"
    - "**/*.pp"
    - "**/*.cfg"
    - "**/*.ini"
    - "**/*.toml"
    - "**/*.tf"
    - "**/Dockerfile"
    - "**/Jenkinsfile"
    - "**/Makefile"

  # Prose only, for a source that is a written statement and nothing else.
  docs_only: &docs_only
    - "**/*.md"
    - "**/*.txt"

  # Everything, for the ALX shell repositories: ALX names its scripts without
  # an extension (`0-hello_world`, `101-metadata`), so no pattern based on
  # extensions can reach them, and 127 of one repository's files are exactly
  # that. Used with exclusions strong enough to remove the binary types that
  # `**/*` would otherwise admit — the only source of its kind here.
  shell_repo: &shell_repo
    - "**/*"


# --- Exclusions that apply to every source -----------------------------------
#
# Universal: no source's object store, bytecode cache, virtual environment, or
# .env is authored work. Source-specific hazards are written out per source
# instead, so that reading one source's entry tells you everything about it
# that is not universally true.
#
# Several of these cannot match anything today — no include profile admits a
# .db file. They are here anyway, and deliberately: widening an include list
# later must not be able to silently admit a virtualenv or a token file. That
# reasoning does not extend to per-source rules, so a per-source exclusion that
# cannot match is not written out at all.
defaults:
  exclude:
    - pattern: "**/.git/"
      reason: "git object store; revisions are tracked, loose objects are not evidence"
    - pattern: "**/__pycache__/"
      reason: "compiled bytecode, regenerated from source on demand"
    - pattern: "**/*.pyc"
      reason: "compiled bytecode"
    - pattern: "**/.pytest_cache/"
      reason: "test-runner cache"
    - pattern: "**/.mypy_cache/"
      reason: "type-checker cache"
    - pattern: "**/.ruff_cache/"
      reason: "linter cache"
    - pattern: "**/node_modules/"
      reason: "installed dependency tree, not authored code"
    # The conventional virtualenv names. The non-conventional ones (my_env,
    # fastapi_venv here) are excluded per source, and validation additionally
    # refuses to load any registry leaving a virtualenv admissible inside a
    # source — detected structurally by pyvenv.cfg, not by name.
    - pattern: "**/.venv/"
      reason: "Python virtual environment"
    - pattern: "**/venv/"
      reason: "Python virtual environment"
    # A generated vector store is always derived from text that is itself
    # available as a source, so it can never be evidence — and in a RAG
    # repository it is large enough to swamp the corpus with its own chunks.
    - pattern: "**/chroma/"
      reason: "generated vector database; derived from text, never evidence"
    - pattern: "**/chroma_db/"
      reason: "generated vector database; derived from text, never evidence"
    - pattern: "**/.env"
      reason: "live credentials; must never enter the corpus"
    - pattern: "**/.env.*"
      reason: "environment variants — the real ones carry credentials and a template is not evidence"
    - pattern: "**/*token*.json"
      reason: "token files (e.g. LinkedIn OAuth tokens) hold credentials"
    - pattern: "**/credentials*.json"
      reason: "credential files"
    - pattern: "**/*.pem"
      reason: "private keys and certificates"
    - pattern: "**/id_rsa*"
      reason: "SSH private keys"
    - pattern: "**/instance/"
      reason: "Flask instance directory; holds generated databases (Quizey V2, taskey)"
    - pattern: "**/*.db"
      reason: "database file — runtime state, regenerated by the application"
    - pattern: "**/*.sqlite"
      reason: "database file — runtime state"
    - pattern: "**/*.sqlite3"
      reason: "database file — runtime state"
    - pattern: "**/*.swp"
      reason: "editor swap file, left behind rather than authored"
    - pattern: "**/.DS_Store"
      reason: "macOS filesystem metadata"
    - pattern: "**/.vscode/"
      reason: "local editor settings"
    - pattern: "**/.claude/"
      reason: "local agent-tooling settings"
    - pattern: "**/.gitignore"
      reason: "repository plumbing"


