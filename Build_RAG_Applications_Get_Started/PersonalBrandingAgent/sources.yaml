# =============================================================================
# Notes
# =============================================================================
#
# Lifetimes and review. Lifecycle is declared and may be wrong; that is what
# the status-review signal is for. A COMPLETED source that acquires changes is
# still synchronized in full — nothing here can express "ignore forever" — and
# the change additionally surfaces as REQUIRES_HUMAN_INTERVENTION, asking
# whether the project is finished after all or the declaration is simply stale.
#
# Credentials. Fourteen of the inspected repositories carry a token embedded
# in their local git remote URL (ALX/taskey among them). Those tokens live in
# each repository's .git/config, not here, and this file records sanitized
# identities only — https://github.com/… rather than https://user:token@… .
# The loader refuses a registry whose identities contain anything that looks
# like a credential, because this file is committed and those URLs are not.
#
# Absolute paths. local_path is written absolutely and this file is
# machine-specific. That is deliberate: this is a single-user system whose
# knowledge base is about one person on one machine (PLAN.md §5.1), and a
# relative path would be a claim about a working directory that does not exist.
